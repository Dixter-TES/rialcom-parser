[project]
name = "rialcom-parser"
version = "0.1.0"
description = "Rialcom internet tariffs parser"
authors = [
    { name = "Artem", email = "66648859+Dixter-TES@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.10,<3.16"
dependencies = [
    "selectolax (>=1.0.2,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]

[tool.poetry]
packages = [{ include = "rialcom_parser", from = "src" }]

[project.scripts]
rialcom_parser = "rialcom_parser.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
